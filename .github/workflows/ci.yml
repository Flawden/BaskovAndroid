name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests, lint and debug APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BaskovAndroid-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
